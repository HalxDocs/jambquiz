name: Scheduler monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check production scheduler
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check scheduler health endpoint
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --silent --show-error --max-time 20 \
            --retry 2 --retry-all-errors --retry-delay 3 \
            --write-out $'\n%{http_code}' \
            https://jambquiz-production.up.railway.app/schedulerz)"
          status="${response##*$'\n'}"
          body="${response%$'\n'*}"
          if [[ "$status" != "200" ]]; then
            echo "::error::Production scheduler health returned HTTP $status"
            echo "$body"
            exit 1
          fi
          echo "$body" | jq -e '.ok == true' >/dev/null
          echo "Production scheduler is healthy."
